name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Links and citations resolve
        run: python tools/check_docs.py

      - name: Checker catches a broken citation and a broken link
        run: |
          printf 'See [S999] and [missing](NOPE.md) and [bad anchor](README.md#no-such-heading).\n' > broken.md
          if python tools/check_docs.py > out.txt; then
            cat out.txt; echo "checker passed a broken doc"; exit 1
          fi
          cat out.txt
          grep -q '\[S999\] is not defined' out.txt
          grep -q 'NOPE.md points at a missing file' out.txt
          grep -q 'no-such-heading has no matching heading' out.txt
          rm broken.md out.txt

  sim:
    name: Rules and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulation and tests (no engine)
        run: |
          cmake -S . -B build -DFAMILIAR_WITH_STRATA=OFF -DFAMILIAR_WARNINGS_AS_ERRORS=ON
          cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  sim-windows:
    name: Rules and tests (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DFAMILIAR_WITH_STRATA=OFF -DFAMILIAR_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
