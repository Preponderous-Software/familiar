name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Links and citations resolve
        run: python tools/check_docs.py

      - name: Checker catches a broken citation and a broken link
        run: |
          printf 'See [S999] and [missing](NOPE.md) and [bad anchor](README.md#no-such-heading).\n' > broken.md
          if python tools/check_docs.py > out.txt; then
            cat out.txt; echo "checker passed a broken doc"; exit 1
          fi
          cat out.txt
          grep -q '\[S999\] is not defined' out.txt
          grep -q 'NOPE.md points at a missing file' out.txt
          grep -q 'no-such-heading has no matching heading' out.txt
          rm broken.md out.txt

  sim:
    name: Rules and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulation and tests (no engine)
        run: |
          cmake -S . -B build -DFAMILIAR_WITH_STRATA=OFF -DFAMILIAR_WARNINGS_AS_ERRORS=ON
          cmake --build build -j4
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  sim-windows:
    name: Rules and tests (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DFAMILIAR_WITH_STRATA=OFF -DFAMILIAR_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  game-linux:
    name: Game (Linux, headless tour)
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 build dependencies and Mesa
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev \
            libegl-dev libgl-dev libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Build the game on Strata
        run: |
          cmake -S . -B build -DFAMILIAR_WARNINGS_AS_ERRORS=ON -DFAMILIAR_BUILD_TESTS=OFF
          cmake --build build -j4 --target familiar
      - name: Headless tour
        run: |
          mkdir -p tour
          ./build/familiar --headless --tour --frames tour --width 960 --height 540
          test "$(ls tour/*.png | wc -l)" -eq 21
      - uses: actions/upload-artifact@v4
        with:
          name: tour-linux
          path: tour/

  game-windows:
    name: Game (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DFAMILIAR_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
